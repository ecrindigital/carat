name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: |
        Provide minimal code that reproduces the issue.
        ```cpp
        // Your code here
        ```
      render: cpp
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS: [e.g., macOS 14.0, Windows 11, Ubuntu 22.04]
        - GPU: [e.g., Apple M1, NVIDIA RTX 3080]
        - Compiler: [e.g., Clang 16, GCC 13]
        - Carat version/commit: [e.g., v0.1.0, abc1234]
      value: |
        - OS:
        - GPU:
        - Compiler:
        - Carat version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant error messages or logs
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided a minimal reproducible example
          required: true
